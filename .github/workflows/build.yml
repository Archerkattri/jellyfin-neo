name: build

on:
  push:
    branches:
      - release
      - prerelease
      - test
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  macos:
    uses: ./.github/workflows/build-macos.yml
    secrets: inherit

  windows:
    uses: ./.github/workflows/build-windows.yml

  linux:
    uses: ./.github/workflows/build-linux.yml
    secrets: inherit

  appimage:
    uses: ./.github/workflows/build-appimage.yml

  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.repository != 'jellyfin/jellyfin-desktop'
    needs: [macos, windows, linux, appimage]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7
    - name: Download platform artifacts
      uses: actions/download-artifact@v8
      with:
        path: release-staging
        pattern: '*'
        merge-multiple: false
    - name: Extract this version's release notes
      run: |
        awk -v section="## ${GITHUB_REF_NAME}" '
          $0 == section { found = 1; next }
          found && /^## / { exit }
          found { print }
          END { if (!found) exit 1 }
        ' CHANGELOG.md > release-notes.md
        test -s release-notes.md
    - name: Prepare assets and checksums
      run: |
        mkdir -p release-assets
        while IFS= read -r -d '' file; do
          relative="${file#release-staging/}"
          artifact="${relative%%/*}"
          base="${file##*/}"
          case "${base,,}" in
            *.deb) name="${artifact}-${base}" ;;
            *) name="${base}" ;;
          esac
          cp -- "$file" "release-assets/$name"
        done < <(find release-staging -type f \( -iname '*.deb' -o -iname '*.exe' -o -iname '*.zip' -o -iname '*.dmg' -o -iname '*.appimage' \) -print0)
        test -n "$(find release-assets -type f -print -quit)"
        (cd release-assets && sha256sum -- * > SHA256SUMS)
    - name: Publish GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "Jellyfin Desktop $GITHUB_REF_NAME" --notes-file release-notes.md release-assets/*
