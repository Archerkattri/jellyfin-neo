name: build-macos

env:
  QT_VERSION: "6.11.3"

on:
  workflow_call:
    secrets:
      MACOS_SIGNING_P12:
        required: false
      MACOS_SIGNING_P12_PASSWORD:
        required: false
      NOTARY_API_KEY_P8:
        required: false
      NOTARY_API_KEY_ID:
        required: false
      NOTARY_API_KEY_ISSUER:
        required: false
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            artifact: macos-arm64
            architecture: arm64
          - runner: macos-15-intel
            artifact: macos-x86_64
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: "${{ env.QT_VERSION }}"
        arch: clang_64
        # Qt 6.12 ships WebEngine only as an online-repo extension that the
        # pinned aqt cannot fetch, so 6.12 installs skip qtwebengine here and
        # complete the SDK with dev/qt/fetch-qtwebengine-ext.sh below.
        modules: "${{ startsWith(env.QT_VERSION, '6.12') && 'qtwebchannel qtpositioning qtserialport' || 'qtwebengine qtwebchannel qtpositioning qtserialport' }}"
        # Qt 6.11 changed the repository layout; use the merged aqt fix until
        # it is included in a tagged aqtinstall release.
        aqtsource: git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b
    - name: Install Qt WebEngine extension (Qt 6.12+)
      if: startsWith(env.QT_VERSION, '6.12')
      run: |
        python3 -m pip install --disable-pip-version-check py7zr
        bash dev/qt/fetch-qtwebengine-ext.sh --qt-root "$QT_ROOT_DIR" --qt-version "${{ env.QT_VERSION }}" --python python3
    - name: Resolve Homebrew cache key
      id: brew-cache-key
      run: |
        brew update
        echo "cellar=$(brew --cellar)" >> "$GITHUB_OUTPUT"
        echo "dlcache=$(brew --cache)" >> "$GITHUB_OUTPUT"
        mpv_rev="$(brew info --json=v2 --formula mpv | jq -r '.formulae[0] | "\(.versions.stable)_r\(.revision)"')"
        echo "mpv=$mpv_rev" >> "$GITHUB_OUTPUT"
    - name: Restore Homebrew mpv cache
      id: brew-cache
      uses: actions/cache/restore@v4
      with:
        path: |
          ${{ steps.brew-cache-key.outputs.cellar }}
          ${{ steps.brew-cache-key.outputs.dlcache }}
        key: brew-mpv-${{ runner.os }}-${{ matrix.architecture }}-${{ steps.brew-cache-key.outputs.mpv }}
        restore-keys: |
          brew-mpv-${{ runner.os }}-${{ matrix.architecture }}-
    - name: Install dependencies
      run: |
        # No-op when the cache already holds this mpv revision.
        brew install mpv || true
        # Restored kegs lose their prefix symlinks; relink everything
        # so pkg-config and the linker see the cached install.
        brew list --formula | while read -r f; do
          brew link --overwrite "$f" >/dev/null 2>&1 || true
        done
        brew list mpv >/dev/null
        pkg-config --modversion mpv
    - name: Save Homebrew mpv cache
      if: steps.brew-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: |
          ${{ steps.brew-cache-key.outputs.cellar }}
          ${{ steps.brew-cache-key.outputs.dlcache }}
        key: brew-mpv-${{ runner.os }}-${{ matrix.architecture }}-${{ steps.brew-cache-key.outputs.mpv }}
    - name: Release build and native tests
      run: |
        set -o pipefail
        test "$("$QT_ROOT_DIR/bin/qmake" -query QT_VERSION)" = "${{ env.QT_VERSION }}"
        cmake -B build -G Ninja \
          -DQTROOT="$QT_ROOT_DIR" \
          -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
          -DCMAKE_OSX_ARCHITECTURES="${{ matrix.architecture }}" \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX=build/output \
          -DCHECK_FOR_UPDATES=ON \
          -DUSE_STATIC_MPVQT=ON 2>&1 | tee "$RUNNER_TEMP/cmake-configure.log"
        grep -Fq -- "-- Qt version: ${{ env.QT_VERSION }}" "$RUNNER_TEMP/cmake-configure.log" || \
          { echo "error: CMake did not configure with Qt ${{ env.QT_VERSION }}" >&2; exit 1; }
        cmake --build build --target install
        cmake --build build --target test_systemcomponent test_log test_settings test_displaymanager test_cursor_idle test_inputplugin
        ctest --test-dir build --output-on-failure
    - name: Configure signing and notarization
      env:
        MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
        MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
        NOTARY_API_KEY_P8: ${{ secrets.NOTARY_API_KEY_P8 }}
        NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
        NOTARY_API_KEY_ISSUER: ${{ secrets.NOTARY_API_KEY_ISSUER }}
      run: |
        if [ -z "$MACOS_SIGNING_P12" ] && [ -z "$MACOS_SIGNING_P12_PASSWORD" ] && \
          [ -z "$NOTARY_API_KEY_P8" ] && [ -z "$NOTARY_API_KEY_ID" ] && \
          [ -z "$NOTARY_API_KEY_ISSUER" ]; then
          echo "::warning::Apple signing/notarization secrets unavailable; artifact will be ad-hoc signed."
          exit 0
        fi

        if [ -z "$MACOS_SIGNING_P12" ] || [ -z "$MACOS_SIGNING_P12_PASSWORD" ] || \
          [ -z "$NOTARY_API_KEY_P8" ] || [ -z "$NOTARY_API_KEY_ID" ] || \
          [ -z "$NOTARY_API_KEY_ISSUER" ]; then
          echo "error: Apple signing/notarization secrets are incomplete; configure all signing secrets or none" >&2
          exit 1
        fi

        umask 077
        P12_FILE="$RUNNER_TEMP/signing.p12"
        KEYCHAIN_FILE="$RUNNER_TEMP/signing.keychain-db"
        KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
        printf '%s' "$MACOS_SIGNING_P12" | base64 -D > "$P12_FILE"
        security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_FILE"
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_FILE"
        security import "$P12_FILE" -k "$KEYCHAIN_FILE" \
          -P "$MACOS_SIGNING_P12_PASSWORD" -T /usr/bin/codesign
        security set-key-partition-list -S apple-tool:,apple: \
          -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_FILE" > /dev/null
        security list-keychains -d user -s "$KEYCHAIN_FILE"
        IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_FILE" \
          | awk '/Developer ID Application/ {print $2; exit}')
        : "${IDENTITY:?Developer ID Application identity not found}"
        echo "MACOS_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

        API_KEY_FILE="$RUNNER_TEMP/AuthKey_${NOTARY_API_KEY_ID}.p8"
        printf '%s' "$NOTARY_API_KEY_P8" | base64 -D > "$API_KEY_FILE"
        {
          echo "NOTARY_API_KEY_FILE=$API_KEY_FILE"
          echo "NOTARY_API_KEY_ID=$NOTARY_API_KEY_ID"
          echo "NOTARY_API_KEY_ISSUER=$NOTARY_API_KEY_ISSUER"
        } >> "$GITHUB_ENV"
    - name: Create and verify DMG
      run: |
        brew install create-dmg
        dev/macos/bundle.sh
        DMG_NAME="JellyfinDesktop-$(cat VERSION)-$(uname -m).dmg"
        test "$(uname -m)" = "${{ matrix.architecture }}"
        lipo -archs "build/output/Jellyfin Desktop.app/Contents/MacOS/Jellyfin Desktop" | grep -qw "${{ matrix.architecture }}"
        hdiutil verify "build/${DMG_NAME}"
    - name: Archive production artifacts
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.artifact }}
        path: ${{ github.workspace }}/build/JellyfinDesktop-*.dmg
