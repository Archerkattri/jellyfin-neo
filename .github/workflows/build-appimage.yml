name: build-appimage

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Build AppImage
      env:
        WORKSPACE: ${{ github.workspace }}
      run: |
        docker build \
          -t jellyfin-desktop-appimage \
          -f dev/appimage/Dockerfile \
          .
        mkdir -p output
        docker run --rm \
          -v "${WORKSPACE}/output:/host-output" \
          jellyfin-desktop-appimage
    - name: Verify bundled Qt runtime version
      run: |
        audit_dir="$(mktemp -d)"
        cd "$audit_dir"
        "$GITHUB_WORKSPACE/output/JellyfinDesktop-x86_64.AppImage" --appimage-extract >/dev/null
        version_file="squashfs-root/usr/share/jellyfin-desktop/qt-runtime-version.txt"
        grep -Fx 'Qt version: 6.11.2' "$version_file"
        grep -Eq '^qt6-base 6\.11\.2-' "$version_file"
        grep -Eq '^qt6-webengine 6\.11\.2-' "$version_file"
        grep -Eq '^qt6-serialport 6\.11\.2-' "$version_file"
        test -f squashfs-root/usr/lib/libQt6Core.so.6.11.2
        test -f squashfs-root/usr/lib/libQt6WebEngineCore.so.6.11.2
        test -f squashfs-root/usr/lib/libQt6SerialPort.so.6.11.2
    - name: Smoke-test AppImage startup
      run: |
        output/JellyfinDesktop-x86_64.AppImage --appimage-extract-and-run --version
    - name: Archive production artifacts
      uses: actions/upload-artifact@v7
      with:
        name: linux-appimage-x86_64
        path: ${{ github.workspace }}/output/JellyfinDesktop-*.AppImage
